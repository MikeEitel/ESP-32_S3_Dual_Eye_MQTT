; PlatformIO Project Configuration File
;
[platformio]
default_envs = seeed_xiao_s3

[env:seeed_xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

lib_extra_dirs = ../___MeLib

lib_ldf_mode = deep+
build_flags =
    -DARDUINO_ESP32RGBPANEL_DISABLED

monitor_speed = 115200
#upload_speed = 115200
upload_speed = 460800

; Add one of the following lines for OTA partitions on ESP32
;board_build.partitions = default_ota.csv  ; Default with OTA support
;board_build.partitions = minimal_ota.csv  ; Minimal with OTA support (more space for sketch
;upload_protocol = esptool
;upload_protocol = espota
upload_port  =  staticIP
;upload_port  =  192.168.167.91       ; Either use the IP address:
                                    ; Or use the hostname (default is usually 'esp32-[chipID]')
                                    ; You can set a custom hostname in your code (see below)
                                    ; upload_port = your_device_hostname.local
;upload_flags =
;  --port=3232
;  --debug
;  --timeout=65
;  --auth=admin
;  --host_ip=192.168.167.253
;  --host_port=12345

monitor_rts = 0
monitor_dtr = 0